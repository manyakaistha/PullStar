name: PullStar
options:
  bundleIdPrefix: com.manyakaistha
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
packages:
  PullStarKit: { path: PullStarKit }
targets:
  PullStar:
    type: application
    platform: iOS
    sources: [PullStar]
    dependencies: [{ package: PullStarKit }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manyakaistha.pullstar.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PullStar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: PullStar saves finished trail images and videos to your library.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
