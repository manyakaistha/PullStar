[workspace]

[package]
name = "raw-astro-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Manya Kaistha"]
publish = false

[dependencies]
libc = "0.2"
rustfft = "6.4"
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"

[build-dependencies]
bindgen = "0.73"

[profile.release]
codegen-units = 1
lto = "thin"
