[package]
name = "pullstar-gui-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Manya Kaistha"]
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
eframe = { version = "0.37.0", default-features = true }
egui = { version = "0.37.0", default-features = true }
rfd = { version = "0.17.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[lib]
name = "pullstar_gui_spike"
path = "src/lib.rs"

[[bin]]
name = "pullstar-gui-spike"
path = "src/main.rs"
