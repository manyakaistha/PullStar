[project]
name = "pullstar"
version = "1.0.2"
description = "Correct camera wobble, export aligned night-sky images, and create star trails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.1.7",
    "photutils>=2.0,<4",
    "astroalign>=2.6,<3",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "piexif>=1.1.3",
    # Older wheels override DNG black-level metadata, producing magenta skies.
    "rawpy>=0.27.1",
    "pillow>=10.0",
    "pyopencl>=2024.3",
    "scikit-image>=0.21.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    # Web API (spawned by the Electron main process)
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "websockets>=12.0",
    "pydantic>=2.7.4",
    "python-multipart>=0.0.9",
    "mcp>=2.3.0",
]

[project.scripts]
pullstar-mcp = "mcp_server.server:main"
star-aligner-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "tifffile>=2024.8.10",
    "pyinstaller>=6.16,<7",
    "imageio-ffmpeg>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["backend*", "core*", "mcp_server*", "modules*", "synthesis*", "video*"]
