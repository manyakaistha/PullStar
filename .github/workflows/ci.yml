name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - name: Expose portable FFmpeg for integration tests
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg
          binary_dir = Path(os.environ['RUNNER_TEMP']) / 'pullstar-bin'
          binary_dir.mkdir(exist_ok=True)
          (binary_dir / 'ffmpeg').symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'], 'a') as paths:
              paths.write(str(binary_dir) + '\n')
          PY
      - run: npm --prefix frontend ci
      - run: uv run pytest -q
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
